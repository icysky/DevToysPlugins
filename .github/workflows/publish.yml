# Publish all DevToys plugins to nuget.org.
#
# Uses NuGet "Trusted Publishing" (OIDC) instead of a long-lived API key:
#   1. nuget.org -> Trusted Publishing -> create a policy with
#        Repository Owner  = <github user/org>
#        Repository        = <this repository name>
#        Workflow File     = publish.yml   (this file, relative to .github/workflows)
#        Scopes            = Push new packages and package versions
#   2. Add a repository secret NUGET_USER with your nuget.org profile name.
#   3. Bump <Version> in each plugin csproj (nuget.org rejects duplicates),
#      then either push a v* tag or run this workflow manually.
#
# Required permission: id-token: write (OIDC token exchange).

name: publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override for every package (e.g. 1.0.2). Empty = use each csproj Version.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 需要创建 GitHub Release 并上传附件
  id-token: write   # NuGet 受信任发布（OIDC）

jobs:
  publish:
    # Keep the same OS/PowerShell as local development: the pack scripts are PS 5.1 friendly.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # 10.0.x: SDK used to build (global.json pins 10.0.403, rollForward=latestFeature)
          # 8.0.x : runtime required to *run* the net8.0 smoke tests and plugins
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Build solution
        shell: powershell
        run: |
          dotnet build DevToysPlugins.slnx -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 直接在 bash 里跑 dotnet run：Windows PowerShell 5.1 捕获原生命令 stderr 时
      # 偶发 ArgumentOutOfRangeException（capacity was less than the current size），
      # 程序还没输出就中断，且 run.ps1 里的 ::error:: 注解也来不及写。
      - name: Smoke tests
        shell: bash
        run: |
          set -e
          for suite in GmCrypto.Smoke ChineseIpsum.Smoke GoogleAuthenticator.Smoke MyCert.Smoke JsFormat.Smoke Cron.Smoke EntityJson.Smoke CodecHub.Smoke; do
            echo "=== $suite"
            dotnet run --project "./tools/$suite/$suite.csproj" -c Release --nologo
          done

      # 注意：必须用「命名参数」调用（哈希表 splat）。
      # 数组 splat 会按位置绑定，'-NoClean' 会被当成 -Configuration 的取值，
      # 而它的 ValidateSet 只有 Debug/Release，于是脚本立刻参数校验失败（这就是第一次 CI 挂的原因）。
      - name: Pack all plugins
        shell: powershell
        run: |
          $version = '${{ inputs.version }}'
          # JsFormat.DevToys 刻意不在列表里：它与 CodeFormatter 类扩展功能重复，仅自用不发 nuget。
          $plugins = @('GmCrypto.DevToys', 'MyCert.DevToys', 'GoogleAuthenticator.DevToys', 'ChineseIpsum.DevToys', 'Cron.DevToys', 'EntityJson.DevToys', 'CodecHub.DevToys')
          foreach ($plugin in $plugins) {
            Write-Host "=== $plugin"
            $packArgs = @{ NoClean = $true }
            if ($version) { $packArgs['Version'] = $version }
            try {
              & "./src/$plugin/pack.ps1" @packArgs
            }
            catch {
              Write-Host "::error::$plugin pack threw: $($_.Exception.Message)"
              exit 1
            }
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::$plugin pack.ps1 exited $LASTEXITCODE"
              exit $LASTEXITCODE
            }
          }

      - name: NuGet login (OIDC -> temporary API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages to nuget.org
        shell: powershell
        run: |
          Get-ChildItem artifacts/*.nupkg | ForEach-Object {
            Write-Host "Pushing $($_.Name)"
            dotnet nuget push $_.FullName `
              --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # 把本次打包的 nupkg 作为附件挂到同名 GitHub Release 上（手动下载用）。
      # Release 已存在时改为覆盖上传，保证重复运行不报错。
      - name: Attach packages to GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $files = @(Get-ChildItem artifacts -Filter *.nupkg | ForEach-Object { $_.FullName })
          Write-Host "release tag: $tag, files: $($files.Count)"

          # 不要对 gh 用 2>$null / 2>&1：GitHub 的 powershell 包装把 $ErrorActionPreference
          # 设为 Stop，原生命令的 stderr 一旦被重定向就变成终止性错误，脚本会直接中断。
          # 这里只靠 $LASTEXITCODE 判断：先尝试创建，失败（通常是 Release 已存在）则改为覆盖上传。
          # Release 说明取自 annotated tag 的注解（git tag -a 的 message）。
          # 注意：不能用本地 git 读——actions/checkout 对 tag 事件是按 SHA 拉成
          # 轻量 tag（refspec 是 +<sha>:refs/tags/<tag>），%(contents) 只会拿到提交信息。
          # 所以这里走 API 取 tag 对象；拿不到（轻量 tag / workflow_dispatch）时用默认文案。
          # 注意 Out-String：gh 的逐行输出会被 PowerShell 收成字符串数组，
          # 直接传给 --notes 会变成多个参数（gh 报 “accepts at most 1 arg”）。
          $notes = ''
          $tagSha = (gh api "repos/${{ github.repository }}/git/ref/tags/$tag" --jq .object.sha | Out-String).Trim()
          if ($LASTEXITCODE -eq 0 -and $tagSha) {
            $notes = (gh api "repos/${{ github.repository }}/git/tags/$tagSha" --jq .message | Out-String).Trim()
          }

          if (-not $notes) {
            $notes = "NuGet: GmCrypto.DevToys / MyCert.DevToys / GoogleAuthenticator.DevToys / ChineseIpsum.DevToys / Cron.DevToys / EntityJson.DevToys / CodecHub.DevToys"
          }

          Write-Host "release notes:"
          Write-Host $notes

          gh release create $tag @files `
            --title $tag `
            --latest `
            --notes $notes

          if ($LASTEXITCODE -ne 0) {
            Write-Host "gh release create returned $LASTEXITCODE, trying upload --clobber"
            gh release upload $tag @files --clobber
          }

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::gh release failed ($LASTEXITCODE)"
            exit $LASTEXITCODE
          }
