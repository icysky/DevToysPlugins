# Publish all DevToys plugins to nuget.org.
#
# Uses NuGet "Trusted Publishing" (OIDC) instead of a long-lived API key:
#   1. nuget.org -> Trusted Publishing -> create a policy with
#        Repository Owner  = <github user/org>
#        Repository        = <this repository name>
#        Workflow File     = publish.yml   (this file, relative to .github/workflows)
#        Scopes            = Push new packages and package versions
#   2. Add a repository secret NUGET_USER with your nuget.org profile name.
#   3. Bump <Version> in each plugin csproj (nuget.org rejects duplicates),
#      then either push a v* tag or run this workflow manually.
#
# Required permission: id-token: write (OIDC token exchange).

name: publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override for every package (e.g. 1.0.2). Empty = use each csproj Version.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 需要创建 GitHub Release 并上传附件
  id-token: write   # NuGet 受信任发布（OIDC）

jobs:
  publish:
    # Keep the same OS/PowerShell as local development: the pack scripts are PS 5.1 friendly.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # 10.0.x: SDK used to build (global.json pins 10.0.403, rollForward=latestFeature)
          # 8.0.x : runtime required to *run* the net8.0 smoke tests and plugins
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Build solution
        shell: powershell
        run: |
          dotnet build DevToysPlugins.slnx -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 每个套件用子进程跑（run.ps1 里有 exit，同会话调用会连带终止调用方），
      # 失败时把输出尾巴写进 ::error:: 注解——注解可通过公开 API 读取，便于远程排障。
      - name: Smoke tests
        shell: powershell
        run: |
          $suites = @('GmCrypto.Smoke', 'ChineseIpsum.Smoke', 'GoogleAuthenticator.Smoke')
          foreach ($suite in $suites) {
            Write-Host "=== $suite"
            $out = & powershell -NoProfile -ExecutionPolicy Bypass -File "./tools/$suite/run.ps1" 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host $out
            if ($code -ne 0) {
              $tail = ($out -split "`r?`n" | Where-Object { $_.Trim() } | Select-Object -Last 12) -join ' | '
              Write-Host "::error::$suite failed (exit $code): $tail"
              Write-Host "::error::runtimes: $((& dotnet --list-runtimes) -join ' | ')"
              exit $code
            }
          }

      # 注意：必须用「命名参数」调用（哈希表 splat）。
      # 数组 splat 会按位置绑定，'-NoClean' 会被当成 -Configuration 的取值，
      # 而它的 ValidateSet 只有 Debug/Release，于是脚本立刻参数校验失败（这就是第一次 CI 挂的原因）。
      - name: Pack all plugins
        shell: powershell
        run: |
          $version = '${{ inputs.version }}'
          $plugins = @('GmCrypto.DevToys', 'MyCert.DevToys', 'GoogleAuthenticator.DevToys', 'ChineseIpsum.DevToys')
          foreach ($plugin in $plugins) {
            Write-Host "=== $plugin"
            $packArgs = @{ NoClean = $true }
            if ($version) { $packArgs['Version'] = $version }
            try {
              & "./src/$plugin/pack.ps1" @packArgs
            }
            catch {
              Write-Host "::error::$plugin pack threw: $($_.Exception.Message)"
              exit 1
            }
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::$plugin pack.ps1 exited $LASTEXITCODE"
              exit $LASTEXITCODE
            }
          }

      - name: NuGet login (OIDC -> temporary API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages to nuget.org
        shell: powershell
        run: |
          Get-ChildItem artifacts/*.nupkg | ForEach-Object {
            Write-Host "Pushing $($_.Name)"
            dotnet nuget push $_.FullName `
              --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # 把本次打包的 nupkg 作为附件挂到同名 GitHub Release 上（手动下载用）。
      # Release 已存在时改为覆盖上传，保证重复运行不报错。
      - name: Attach packages to GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $files = @(Get-ChildItem artifacts -Filter *.nupkg | ForEach-Object { $_.FullName })
          Write-Host "release tag: $tag, files: $($files.Count)"

          # 不要对 gh 用 2>$null / 2>&1：GitHub 的 powershell 包装把 $ErrorActionPreference
          # 设为 Stop，原生命令的 stderr 一旦被重定向就变成终止性错误，脚本会直接中断。
          # 这里只靠 $LASTEXITCODE 判断：先尝试创建，失败（通常是 Release 已存在）则改为覆盖上传。
          # Release 说明取自 annotated tag 的注解（git tag -a 的 message），
          # 没有注解（轻量 tag 或 workflow_dispatch）时退回默认文案。
          $notes = (git tag -l --format='%(contents)' $tag | Out-String).Trim()
          if (-not $notes) {
            $notes = "NuGet: GmCrypto.DevToys / MyCert.DevToys / GoogleAuthenticator.DevToys / ChineseIpsum.DevToys"
          }

          Write-Host "release notes:"
          Write-Host $notes

          gh release create $tag @files `
            --title $tag `
            --latest `
            --notes $notes

          if ($LASTEXITCODE -ne 0) {
            Write-Host "gh release create returned $LASTEXITCODE, trying upload --clobber"
            gh release upload $tag @files --clobber
          }

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::gh release failed ($LASTEXITCODE)"
            exit $LASTEXITCODE
          }
